version: '3.7'

services:
  phoneinfoga:
    container_name: phoneinfoga
    restart: on-failure
    build:
      context: ../..
      dockerfile: ../../Dockerfile
    command:
      - "serve"
    ports:
      - "80:5000"
    environment:
      - GIN_MODE=release
      # Lookup persistence database. Kept on the mounted ./data volume so lookups and
      # their scanner results survive container restarts. Back up by copying ./data
      # (including the -wal/-shm sidecar files).
      - PHONEINFOGA_DB_PATH=/app/data/phoneinfoga.db
    volumes:
      - ./data:/app/data
